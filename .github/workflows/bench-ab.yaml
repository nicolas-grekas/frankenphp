---
name: Bench A/B
on:
  workflow_dispatch:
    inputs:
      a:
        description: ref A
        default: bgworker-tasks
      b:
        description: ref B
        default: bgworker-vars-cache
      c:
        description: ref C, optional
        default: ""
      d:
        description: ref D, optional
        default: ""
      rounds:
        description: rounds
        default: "4"
  push:
    branches:
      - bench-ab
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  GOFLAGS: "-tags=nobadger,nomysql,nopgx,nowatcher"
jobs:
  ab:
    name: A/B ${{ inputs.a || 'bgworker-tasks' }} vs ${{ inputs.b || 'bgworker-vars-cache' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.a || 'bgworker-tasks' }}
          path: side-a
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.b || 'bgworker-vars-cache' }}
          path: side-b
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.c != ''
        with:
          ref: ${{ inputs.c }}
          path: side-c
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.d != ''
        with:
          ref: ${{ inputs.d }}
          path: side-d
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          working-directory: side-a
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          ini-file: development
          coverage: none
          tools: none
        env:
          phpts: ts
      - name: Install strace
        run: sudo apt-get install -y strace
      - name: Set CGO flags
        run: echo "CGO_CFLAGS=-DFRANKENPHP_TEST $(php-config --includes)" >> "${GITHUB_ENV}"
      - name: Machine
        run: nproc; lscpu | grep -E 'Model name|Hypervisor' || true
      - name: A/B
        env:
          ROUNDS: ${{ inputs.rounds || '4' }}
          REF_A: ${{ inputs.a || 'bgworker-tasks' }}
          REF_B: ${{ inputs.b || 'bgworker-vars-cache' }}
          REF_C: ${{ inputs.c }}
          REF_D: ${{ inputs.d }}
        run: |
          sides=("${REF_A//\//-}=$PWD/side-a" "${REF_B//\//-}=$PWD/side-b")
          if [ -n "$REF_C" ]; then sides+=("${REF_C//\//-}=$PWD/side-c"); fi
          if [ -n "$REF_D" ]; then sides+=("${REF_D//\//-}=$PWD/side-d"); fi
          bench/ab.sh "$ROUNDS" "${sides[@]}"
